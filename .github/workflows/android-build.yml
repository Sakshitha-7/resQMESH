name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

env:
  SETUP_JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Run unit tests and lint
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: Test and lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Make scripts and gradlew executable
        run: chmod +x gradlew tools/arti-build/*.sh tools/reproducible-builds/*.sh

      - name: Set up JDK ${{ env.SETUP_JAVA_VERSION }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.SETUP_JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify native library checksums
        run: tools/arti-build/verify-checksums.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            **/build/test-results/
            **/build/reports/tests/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-results
          path: "**/build/reports/lint-results-*.html"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build debug APK and publish as GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Make scripts and gradlew executable
        run: chmod +x gradlew tools/arti-build/*.sh tools/reproducible-builds/*.sh

      - name: Set up JDK ${{ env.SETUP_JAVA_VERSION }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.SETUP_JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Organize APK artifacts
        run: |
          mkdir -p artifacts
          for f in app/build/outputs/apk/debug/*.apk; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              cp "$f" "artifacts/$base"
              if [[ "$base" == *universal* ]]; then
                cp "$f" "artifacts/resq-mesh-universal-debug.apk"
              fi
            fi
          done
          echo "Generated APK files:"
          ls -la artifacts/

      - name: Upload debug APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resq-mesh-debug-apks
          path: artifacts/*.apk
          retention-days: 30

      # Create/update a rolling "latest" GitHub Release on every push to main
      - name: Publish GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2
        with:
          tag_name: latest-debug
          name: "⚡ resQ Mesh — Latest Debug Build"
          body: |
            ## resQ Mesh — Emergency Offline Mesh Network

            **Commit:** `${{ github.sha }}`  
            **Branch:** `${{ github.ref_name }}`  

            ### What's new in this build
            - 🔴 Big SOS emergency button on Home screen with pulsing radar animation
            - 📡 Instant mesh broadcast to all nearby BLE devices (no internet or cellular required)
            - 🔊 Audible alarm + SOS Morse code vibration on all receiving devices
            - 🔐 Signed DISTRESS packets with 5-minute TTL and priority mesh routing

            ### How to install
            1. Download **resq-mesh-universal-debug.apk** (recommended, works on all devices) or your device architecture APK from Assets below
            2. On your Android phone: Settings → Security → **Allow unknown sources**
            3. Open the downloaded APK and tap **Install**
          files: artifacts/*.apk
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
