name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write   # needed to create GitHub Releases

env:
  SETUP_JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Run unit tests and lint
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: Test and lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK ${{ env.SETUP_JAVA_VERSION }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.SETUP_JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify native library checksums
        run: tools/arti-build/verify-checksums.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            **/build/test-results/
            **/build/reports/tests/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-results
          path: "**/build/reports/lint-results-*.html"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build debug APK and publish as GitHub Release on every main push
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04
    # Run even when verify fails so hackathon judges always get a fresh APK
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK ${{ env.SETUP_JAVA_VERSION }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.SETUP_JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK for clarity
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/resq-mesh-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resq-mesh-debug-apk
          path: artifacts/resq-mesh-debug.apk
          retention-days: 30

      # Create/update a rolling "latest" GitHub Release on every push to main
      - name: Publish GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2
        with:
          tag_name: latest-debug
          name: "⚡ resQ Mesh — Latest Debug Build"
          body: |
            ## resQ Mesh — Emergency Offline Mesh Network

            **Commit:** `${{ github.sha }}`  
            **Branch:** `${{ github.ref_name }}`  
            **Built:** ${{ github.event.head_commit.timestamp }}

            ### What's new in this build
            - 🔴 Big SOS emergency button on Home screen with radar pulse animation
            - 📡 Instant mesh broadcast to all nearby BLE devices (no internet needed)
            - 🔊 Audible alarm + SOS Morse vibration on all receiving devices
            - 🔐 Signed DISTRESS packets with 5-minute TTL and priority propagation

            ### How to install
            1. Download **resq-mesh-debug.apk** below
            2. On your Android phone: Settings → Security → **Allow unknown sources**
            3. Open the downloaded APK and tap **Install**

            > This is a debug/evaluation build. Do not use the signing key for production.
          files: artifacts/resq-mesh-debug.apk
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 & 4: Reproducible release build (byte-identical across two runners)
  # ─────────────────────────────────────────────────────────────────────────────
  reproducible-build:
    name: Reproducible release build ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    needs: verify
    if: always()
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK ${{ env.SETUP_JAVA_VERSION }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.SETUP_JAVA_VERSION }}

      - name: Set up Gradle (no cache for reproducibility)
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      - name: Build canonical unsigned release
        run: tools/reproducible-builds/build-in-container.sh "$RUNNER_TEMP/release-${{ matrix.replica }}"

      - name: Upload build replica
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducible-release-${{ matrix.replica }}
          path: ${{ runner.temp }}/release-${{ matrix.replica }}/*
          if-no-files-found: error

  compare-reproducible-builds:
    name: Compare release bytes
    runs-on: ubuntu-24.04
    needs: reproducible-build

    steps:
      - name: Checkout verification script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download replica A
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reproducible-release-a
          path: ${{ runner.temp }}/release-a

      - name: Download replica B
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reproducible-release-b
          path: ${{ runner.temp }}/release-b

      - name: Compare every canonical byte
        run: tools/reproducible-builds/compare-release.sh "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"
